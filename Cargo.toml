[workspace]
members = [
    "crates/core",
    "crates/information",
    "crates/geometry",
    "crates/graph",
    "crates/dsp",
    "crates/ffts",
    "crates/ffts_reference",
    "crates/integration",
    "crates/file_io",
    "crates/interpolation",
    "crates/linalg",
    "crates/linalg_reference",
    "crates/number_theory",
    "crates/optimization",
    "crates/random",
    "crates/derivatives",
    "crates/sorting",
    "crates/special_functions",
    "crates/statistics",
    "crates/root_finding",
    "crates/machine_learning",
    "crates/electromagnetics",
    "crates/utils",
    "book/generator",
]
# The LAPACK comparison benchmarks are a separate package so that ndarray-linalg (and the system
# OpenBLAS it needs) can never be feature-unified into the library's builds.
exclude = ["crates/linalg_bench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
num-complex = "0.4.6"
num-traits = "0.2.19"
ndarray = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
criterion = "0.8.2"
rustfft = "6.4.1"

[package]
name = "lib_jsl"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
description = "Umbrella facade crate for the lib_jsl scientific computing workspace."

[lib]
path = "src/mod.rs"

[dependencies]
lib_jsl_core = { path = "crates/core" }
lib_jsl_information = { path = "crates/information" }
lib_jsl_geometry = { path = "crates/geometry" }
lib_jsl_graph = { path = "crates/graph" }
lib_jsl_dsp = { path = "crates/dsp" }
lib_jsl_ffts = { path = "crates/ffts" }
lib_jsl_file_io = { path = "crates/file_io" }
lib_jsl_integration = { path = "crates/integration" }
lib_jsl_interpolation = { path = "crates/interpolation" }
lib_jsl_linalg = { path = "crates/linalg" }
lib_jsl_number_theory = { path = "crates/number_theory" }
lib_jsl_optimization = { path = "crates/optimization" }
lib_jsl_random = { path = "crates/random" }
lib_jsl_derivatives = { path = "crates/derivatives" }
lib_jsl_sorting = { path = "crates/sorting" }
lib_jsl_special_functions = { path = "crates/special_functions" }
lib_jsl_statistics = { path = "crates/statistics" }
lib_jsl_root_finding = { path = "crates/root_finding" }
lib_jsl_machine_learning = { path = "crates/machine_learning" }
lib_jsl_electromagnetics = { path = "crates/electromagnetics" }
lib_jsl_utils = { path = "crates/utils" }

[features]
# Serialisation of geometry types with serde.
serde = ["lib_jsl_geometry/serde"]
