[package]
name = "lib_jsl_linalg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Dense linear algebra in pure Rust: LU, Cholesky, eigensolvers, the SVD and least squares for real and complex matrices."

[lib]
path = "src/mod.rs"

[dependencies]
matrixmultiply.workspace = true
ndarray.workspace = true
num-complex.workspace = true
num-traits.workspace = true

[features]
# Multithreaded matrix multiplication inside the blocked factorisations (up to 4 threads, set by
# the MATMUL_NUM_THREADS environment variable; the default is the number of physical cores).
threading = ["matrixmultiply/threading"]
