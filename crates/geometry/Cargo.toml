[package]
name = "lib_jsl_geometry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
description = "Geometry: 1D to 4D types, Delaunay and Voronoi, convex hulls, spatial trees, intersections and mesh processing."

[lib]
path = "src/mod.rs"

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# Serialize (and, where implemented, deserialize) geometry types and tables with serde.
serde = ["dep:serde", "dep:serde_json"]
