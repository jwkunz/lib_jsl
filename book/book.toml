[book]
title = "Numerical Algorithms with lib_jsl"
description = "An encyclopedia of the algorithms in the lib_jsl scientific computing library: what they do, where they came from, why they work, and how they are implemented."
authors = ["Jake Kunzler"]
language = "en"
src = "src"

[build]
build-dir = "../target/book"
create-missing = false

[preprocessor.katex]
after = ["links"]

[output.html]
git-repository-url = "https://github.com/jwkunz/lib_jsl"
edit-url-template = "https://github.com/jwkunz/lib_jsl/edit/main/book/{path}"
site-url = "/lib_jsl/book/"
mathjax-support = false
additional-css = ["css/entry.css"]

[output.html.fold]
enable = true
level = 1
