<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect width="760" height="260" fill="#ffffff" rx="6"/><text x="380" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Cleaning a noisy binary image</text><image x="16" y="40" width="170" height="170" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/><clipPath id="panel0"><rect x="16" y="40" width="170" height="170"/></clipPath><g clip-path="url(#panel0)"><g transform="translate(16 40) scale(1.4166666666666667)"></g></g><rect x="16" y="40" width="170" height="170" fill="none" stroke="#666"/><text x="101" y="230" text-anchor="middle" fill="#222">noisy: 1.2% of pixels flipped</text><image x="202" y="40" width="170" height="170" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/><clipPath id="panel1"><rect x="202" y="40" width="170" height="170"/></clipPath><g clip-path="url(#panel1)"><g transform="translate(202 40) scale(1.4166666666666667)"></g></g><rect x="202" y="40" width="170" height="170" fill="none" stroke="#666"/><text x="287" y="230" text-anchor="middle" fill="#222">opening (removes specks)</text><image x="388" y="40" width="170" height="170" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/><clipPath id="panel2"><rect x="388" y="40" width="170" height="170"/></clipPath><g clip-path="url(#panel2)"><g transform="translate(388 40) scale(1.4166666666666667)"></g></g><rect x="388" y="40" width="170" height="170" fill="none" stroke="#666"/><text x="473" y="230" text-anchor="middle" fill="#222">then closing (fills pinholes)</text><image x="574" y="40" width="170" height="170" preserveAspectRatio="none" style="image-rendering:pixelated" href="data:image/png;base64,"/><clipPath id="panel3"><rect x="574" y="40" width="170" height="170"/></clipPath><g clip-path="url(#panel3)"><g transform="translate(574 40) scale(1.4166666666666667)"></g></g><rect x="574" y="40" width="170" height="170" fill="none" stroke="#666"/><text x="659" y="230" text-anchor="middle" fill="#222">then hole filling</text></svg>